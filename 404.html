<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>워드 커넥션</title>
<script>
/* 주소 뒤에 글자가 붙거나(예: …/word-connection/)와) 대소문자가 달라도 워드 커넥션으로 보냄 */
(function () { var p = location.pathname.toLowerCase();
  if (p.indexOf("word") > -1 || p.indexOf("conn") > -1 || p.indexOf("wc") > -1) location.replace("/jk-portfolio-preview/word-connection/" + location.search);
  else location.replace("/jk-portfolio-preview/"); })();
</script></head><body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#8c8c8c">이동하는 중…</body></html>
